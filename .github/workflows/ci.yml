name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test
    # GitHub-hosted: this repo is PUBLIC, so a self-hosted runner would let
    # anyone opening a pull request run code on the homelab host. Hosted
    # runners are also free for public repos, so there is nothing to save.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # mcp too: the MCP server's tools are tested, and without the extra those
      # tests cannot import.
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check src/ tests/
      - run: pytest tests/ -v

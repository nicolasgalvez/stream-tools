name: Jira

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  jira-sync:
    # GitHub-hosted: this repo is PUBLIC, so a self-hosted runner would let
    # anyone opening a pull request run code on the homelab host. Hosted
    # runners are also free for public repos, so there is nothing to save.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: procyon-creative/jira-action-man@v2
        id: jira
        with:
          projects: "STRM,VGM"
          from: "branch,title,commits,body"
          post_to_jira: true
          jira_comment_mode: update
          jira_base_url: ${{ secrets.JIRA_BASE_URL }}
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  jira-transition-qa:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    # GitHub-hosted: this repo is PUBLIC, so a self-hosted runner would let
    # anyone opening a pull request run code on the homelab host. Hosted
    # runners are also free for public repos, so there is nothing to save.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: procyon-creative/jira-action-man@v2
        id: jira
        with:
          projects: "STRM,VGM"
          from: "branch,title,commits,body"
          post_to_jira: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Transition Jira issues to QA
        if: steps.jira.outputs.found == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEYS: ${{ steps.jira.outputs.keys }}
          TARGET_COLUMN: "QA"
        run: |
          set -euo pipefail
          : "${JIRA_BASE_URL:?JIRA_BASE_URL secret is empty}"
          : "${JIRA_EMAIL:?JIRA_EMAIL secret is empty}"
          : "${JIRA_API_TOKEN:?JIRA_API_TOKEN secret is empty}"
          : "${JIRA_KEYS:?JIRA_KEYS output from jira-action-man is empty}"

          JIRA_BASE_URL="$(printf '%s' "$JIRA_BASE_URL" | tr -d '[:space:]')"
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          for key in $(echo "$JIRA_KEYS" | jq -r '.[]'); do
            echo "Transitioning $key to $TARGET_COLUMN..."
            url="${JIRA_BASE_URL}/rest/api/3/issue/${key}/transitions"

            TRANSITIONS=$(curl --silent --fail-with-body \
              --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              --url "$url")
            TARGET_ID=$(echo "$TRANSITIONS" | jq -r --arg name "$TARGET_COLUMN" \
              '.transitions[] | select(.name == $name) | .id')

            if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
              echo "  ⚠ No '$TARGET_COLUMN' transition available for $key — skipping."
              continue
            fi

            curl --silent --fail-with-body \
              --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg id "$TARGET_ID" '{transition:{id:$id}}')" \
              --url "$url"
            echo "  ✓ $key → $TARGET_COLUMN"
          done

  jira-transition-done:
    if: github.event.pull_request.merged == true
    # GitHub-hosted: this repo is PUBLIC, so a self-hosted runner would let
    # anyone opening a pull request run code on the homelab host. Hosted
    # runners are also free for public repos, so there is nothing to save.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: procyon-creative/jira-action-man@v2
        id: jira
        with:
          projects: "STRM,VGM"
          from: "branch,title,commits,body"
          post_to_jira: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Transition Jira issues to Done
        if: steps.jira.outputs.found == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEYS: ${{ steps.jira.outputs.keys }}
          TARGET_COLUMN: "Done"
          # Untrusted: a PR title and body are attacker-controlled on a public
          # repo. Passed through the environment, never interpolated below.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          : "${JIRA_BASE_URL:?JIRA_BASE_URL secret is empty}"
          : "${JIRA_EMAIL:?JIRA_EMAIL secret is empty}"
          : "${JIRA_API_TOKEN:?JIRA_API_TOKEN secret is empty}"
          : "${JIRA_KEYS:?JIRA_KEYS output from jira-action-man is empty}"

          JIRA_BASE_URL="$(printf '%s' "$JIRA_BASE_URL" | tr -d '[:space:]')"
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          # A ticket is Done only if the PR says it closes it. A key in a branch
          # name or title means the work is related, not finished — a ticket takes
          # several PRs, and closing it on the first one left VGM-14 marked Done
          # for two months against a placeholder. GitHub's closing keywords are
          # the vocabulary.
          CLOSING_KEYS=$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY" \
            | grep -ioE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b[[:space:]:]+[A-Za-z][A-Za-z0-9]+-[0-9]+' \
            | grep -ioE '[A-Za-z][A-Za-z0-9]+-[0-9]+' \
            | tr "[:lower:]" "[:upper:]" \
            | sort -u || true)
          echo "Closing keywords name: ${CLOSING_KEYS:-(none)}"

          for key in $(echo "$JIRA_KEYS" | jq -r '.[]'); do
            if ! printf '%s\n' "$CLOSING_KEYS" | grep -qx "$key"; then
              echo "  – $key is referenced but not closed by this PR; leaving it."
              continue
            fi
            echo "Transitioning $key to $TARGET_COLUMN..."
            url="${JIRA_BASE_URL}/rest/api/3/issue/${key}/transitions"

            TRANSITIONS=$(curl --silent --fail-with-body \
              --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              --url "$url")
            TARGET_ID=$(echo "$TRANSITIONS" | jq -r --arg name "$TARGET_COLUMN" \
              '.transitions[] | select(.name == $name) | .id')

            if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
              echo "  ⚠ No '$TARGET_COLUMN' transition available for $key — skipping."
              continue
            fi

            curl --silent --fail-with-body \
              --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg id "$TARGET_ID" '{transition:{id:$id}}')" \
              --url "$url"
            echo "  ✓ $key → $TARGET_COLUMN"
          done

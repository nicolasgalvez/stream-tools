services:
  stream-tools:
    build: .
    env_file: .env
    volumes:
      - ${HOME}/.config/stream-tools:/home/appuser/.config/stream-tools
    restart: unless-stopped
    # Watches the stream named by YT_WATCH_STREAM_ID in .env. Without it the
    # command exits with an error rather than guess which stream to watch.
    command: ["stream", "watch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stream-tools"
version = "0.1.0"
description = "YouTube Live Stream management tool"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth>=2.57.1",
    "loguru>=0.7.3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "typer>=0.27.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pdoc>=14.0",
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    # Pinned: unpinned, CI installed whatever shipped that day. 0.16 widened
    # ruff's default rules and surfaced 84 pre-existing findings, so the gate
    # passed or failed depending on the date rather than the code. Upgrading
    # is worth doing deliberately, with those findings addressed.
    "ruff==0.14.14",
]
mcp = [
    "mcp>=1.12.0",
]

[project.scripts]
yt = "stream_tools_cli.app:app"
yt-mcp = "stream_tools_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_tools", "src/stream_tools_cli", "src/stream_tools_mcp"]

[tool.ruff]
src = ["src"]
line-length = 100

# Ruff's *default* rule set is not stable across releases: 0.14 defaulted to
# E4/E7/E9/F, 0.16 widened the default to a few hundred rules. With no `select`
# here, "does this repo lint?" depended on which ruff CI happened to install.
# The families below are chosen deliberately, so a ruff upgrade changes the
# gate only when we edit this list.
[tool.ruff.lint]
select = [
    "F",     # pyflakes - real errors (undefined names, unused imports)
    "E4",    # pycodestyle - import placement
    "E7",    # pycodestyle - statement errors (bare except, comparisons)
    "E9",    # pycodestyle - syntax / IO errors
    "W",     # pycodestyle warnings
    "I",     # isort - import ordering
    "UP",    # pyupgrade - keep up with the >=3.11 floor
    "B",     # flake8-bugbear - likely bugs
    "BLE",   # flake8-blind-except - unqualified `except Exception`
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez - naive datetimes
    "PIE",   # flake8-pie
    "SIM",   # flake8-simplify
    "FURB",  # refurb - modern stdlib idioms
    "RUF",   # ruff-specific
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "ISC",   # implicit string concatenation
    "TC",    # typing-only imports
    "FLY",   # static-join-to-f-string
    "FA",    # future annotations
    "ASYNC", # flake8-async
    "EXE",   # shebang / executable-bit consistency
    "INT",   # gettext
    "PGH",   # pygrep-hooks - blanket noqa / type: ignore
    "N",     # pep8-naming
    "YTT",   # sys.version misuse
]

ignore = [
    # `raise ... from err` sets __cause__, which changes the traceback a caller
    # sees. 47 sites; worth doing, but it is an behavior change and belongs in
    # its own PR, not in a lint-configuration one.
    "B904",
    # `class X(str, Enum)` -> `StrEnum` changes what `str(X.A)` returns, and
    # these values are serialized to the YouTube API. Deliberately not taken.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"src/stream_tools_cli/app.py" = ["E402"]

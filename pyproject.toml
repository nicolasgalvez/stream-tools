[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stream-tools"
version = "0.1.0"
description = "YouTube Live Stream management tool"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth>=2.23.0",
    "loguru>=0.7.3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "typer[all]>=0.27.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pdoc>=14.0",
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    # Pinned: unpinned, CI installed whatever shipped that day. 0.16 widened
    # ruff's default rules and surfaced 84 pre-existing findings, so the gate
    # passed or failed depending on the date rather than the code. Upgrading
    # is worth doing deliberately, with those findings addressed.
    "ruff==0.14.14",
]
mcp = [
    "mcp>=1.12.0",
]

[project.scripts]
yt = "stream_tools_cli.app:app"
yt-mcp = "stream_tools_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_tools", "src/stream_tools_cli", "src/stream_tools_mcp"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/stream_tools_cli/app.py" = ["E402"]
